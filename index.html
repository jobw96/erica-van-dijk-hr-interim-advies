  <meta property="og:title" content="Erica van Dijk - HR Interim &amp;amp; Advies">
  <meta name="twitter:title" content="Erica van Dijk - HR Interim &amp;amp; Advies">
  <meta property="og:description" content="Pragmatisch &amp; betrouwbaar HR Interim Management. Ervaren allround interim HR Manager met een no-nonsense aanpak voor organisatieontwikkeling en HR-advies.">
  <meta name="twitter:description" content="Pragmatisch &amp; betrouwbaar HR Interim Management. Ervaren allround interim HR Manager met een no-nonsense aanpak voor organisatieontwikkeling en HR-advies.">

  <!-- Pre-React SEO Bootstrap: injects route-specific meta before React hydrates -->
  <script>
    (function () {
      try {
        var SITE_URL = 'https://ericavandijk.nl';
        var SITE_NAME = 'Erica van Dijk - HR Interim & Advies';
        var TAGLINE = 'Pragmatisch & betrouwbaar HR Interim Management';
        var DEFAULT_IMAGE = 'https://storage.googleapis.com/gpt-engineer-file-uploads/8J9ts0tlIuZAwHTFHhaFZxeANjn1/social-images/social-1764600536479-Erica%20herosectie%20foto.png';
        var DEFAULT_DESC = 'Pragmatisch & betrouwbaar HR Interim Management. Ervaren allround interim HR Manager met een no-nonsense aanpak voor organisatieontwikkeling en HR-advies.';

        var routes = {
          '/': {
            title: SITE_NAME,
            description: DEFAULT_DESC,
            type: 'website'
          },
          '/experience': {
            title: 'Ervaring & Projecten | ' + SITE_NAME,
            description: 'Bekijk gerealiseerde HR-projecten en interim opdrachten bij toonaangevende organisaties als Heineken, KLM en Bunge.',
            type: 'website'
          },
          '/contact': {
            title: 'Contact | ' + SITE_NAME,
            description: 'Neem contact op met Erica van Dijk voor vrijblijvend advies over HR interim management en organisatieontwikkeling.',
            type: 'website'
          }
        };

        var path = window.location.pathname.replace(/\/$/, '') || '/';
        var meta = routes[path];
        if (!meta && path.indexOf('/experience/') === 0) {
          meta = {
            title: 'Project | ' + SITE_NAME,
            description: 'Detailoverzicht van een HR interim project van Erica van Dijk.',
            type: 'article'
          };
        }
        if (!meta) return;

        var canonical = SITE_URL + (path === '/' ? '/' : path);

        document.title = meta.title;

        function setMeta(attr, key, value) {
          var el = document.querySelector('meta[' + attr + '="' + key + '"]');
          if (!el) {
            el = document.createElement('meta');
            el.setAttribute(attr, key);
            document.head.appendChild(el);
          }
          el.setAttribute('content', value);
        }

        setMeta('name', 'description', meta.description);
        setMeta('property', 'og:title', meta.title);
        setMeta('property', 'og:description', meta.description);
        setMeta('property', 'og:url', canonical);
        setMeta('property', 'og:type', meta.type);
        setMeta('property', 'og:image', DEFAULT_IMAGE);
        setMeta('property', 'og:site_name', SITE_NAME);
        setMeta('property', 'og:locale', 'nl_NL');
        setMeta('name', 'twitter:card', 'summary_large_image');
        setMeta('name', 'twitter:title', meta.title);
        setMeta('name', 'twitter:description', meta.description);
        setMeta('name', 'twitter:image', DEFAULT_IMAGE);

        var canonicalEl = document.querySelector('link[rel="canonical"]');
        if (!canonicalEl) {
          canonicalEl = document.createElement('link');
          canonicalEl.setAttribute('rel', 'canonical');
          document.head.appendChild(canonicalEl);
        }
        canonicalEl.setAttribute('href', canonical);
      } catch (e) {
        // fail silently — React Helmet will take over
      }
    })();
  </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
